name: 'AutoDev Remote Agent'
description: 'Automated GitHub issue analysis using AI-powered code analysis'
author: 'AutoDev authors'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  
  workspace-path:
    description: 'Path to the repository workspace'
    required: false
    default: ${{ github.workspace }}
  
  analysis-depth:
    description: 'Depth of analysis (shallow, medium, deep)'
    required: false
    default: 'medium'
  
  auto-comment:
    description: 'Automatically add analysis comment to issues'
    required: false
    default: 'true'
  
  auto-label:
    description: 'Automatically add labels to issues based on analysis'
    required: false
    default: 'true'
  
  trigger-events:
    description: 'Comma-separated list of issue events to trigger analysis'
    required: false
    default: 'opened,edited,reopened'
  
  exclude-labels:
    description: 'Comma-separated list of labels to exclude from analysis'
    required: false
    default: ''
  
  include-labels:
    description: 'Comma-separated list of labels to include for analysis (if empty, all issues are analyzed)'
    required: false
    default: ''
  
  webhook-secret:
    description: 'Secret for webhook verification (for standalone server mode)'
    required: false
    default: ''

  openai-api-key:
    description: 'OpenAI API key for LLM analysis'
    required: false
    default: ''

  deepseek-token:
    description: 'DeepSeek API token for LLM analysis'
    required: false
    default: ''

  glm-token:
    description: 'GLM API token for LLM analysis'
    required: false
    default: ''

  include-config-files:
    description: 'Include configuration files in analysis (jest.config.js, rollup.config.mjs, etc.)'
    required: false
    default: 'true'

  include-test-files:
    description: 'Include test files in analysis (__tests__/, *.test.js, etc.)'
    required: false
    default: 'true'

  include-patterns:
    description: 'Comma-separated list of file patterns to force include in analysis'
    required: false
    default: ''

  exclude-patterns:
    description: 'Comma-separated list of file patterns to exclude from analysis'
    required: false
    default: ''

  force-include-files:
    description: 'Comma-separated list of specific files to always include in analysis'
    required: false
    default: ''

outputs:
  success:
    description: 'Whether the analysis was successful'
  
  comment-added:
    description: 'Whether a comment was added to the issue'
  
  labels-added:
    description: 'Comma-separated list of labels that were added'
  
  execution-time:
    description: 'Time taken to complete the analysis (in milliseconds)'
  
  error:
    description: 'Error message if the analysis failed'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      shell: bash
      run: npm ci
    
    - name: Build project
      shell: bash
      run: npm run build:action
    
    - name: Run action
      shell: node
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_WORKSPACE_PATH: ${{ inputs.workspace-path }}
        INPUT_ANALYSIS_DEPTH: ${{ inputs.analysis-depth }}
        INPUT_AUTO_COMMENT: ${{ inputs.auto-comment }}
        INPUT_AUTO_LABEL: ${{ inputs.auto-label }}
        INPUT_TRIGGER_EVENTS: ${{ inputs.trigger-events }}
        INPUT_EXCLUDE_LABELS: ${{ inputs.exclude-labels }}
        INPUT_INCLUDE_LABELS: ${{ inputs.include-labels }}
        INPUT_WEBHOOK_SECRET: ${{ inputs.webhook-secret }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_DEEPSEEK_TOKEN: ${{ inputs.deepseek-token }}
        INPUT_GLM_TOKEN: ${{ inputs.glm-token }}
        INPUT_INCLUDE_CONFIG_FILES: ${{ inputs.include-config-files }}
        INPUT_INCLUDE_TEST_FILES: ${{ inputs.include-test-files }}
        INPUT_INCLUDE_PATTERNS: ${{ inputs.include-patterns }}
        INPUT_EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
        INPUT_FORCE_INCLUDE_FILES: ${{ inputs.force-include-files }}
      run: dist/index.js
